    <!-- The saved theme, before anything is drawn, so dark mode does not flash white. Reads only. -->
    <script>
      (function () {
        var palette = 'sage', mode = 'auto';
        try {
          var s = JSON.parse(localStorage.getItem('wordaday.v1') || '{}');
          if (/^(sage|moss|clay|sky|blush)$/.test(s.palette)) palette = s.palette;
          if (/^(light|dark)$/.test(s.mode)) mode = s.mode;
        } catch (e) { /* no saved theme */ }
        if (mode === 'auto') mode = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-palette', palette);
        document.documentElement.setAttribute('data-mode', mode);
        // A script that fails before the app has started: show the advice at once.
        window.addEventListener('error', function () {
          var late = document.getElementById('boot-late');
          if (late) late.className = 'now';
        }, true);
      })();
    </script>
    <style>
      .boot { padding: 30vh 24px 0; text-align: center; font-family: Georgia, serif; font-size: 2rem; }
      .boot p { margin: 0 0 12px; }
      #boot-late { font: 1rem/1.5 system-ui, sans-serif; opacity: 0; animation: boot-late 0.3s 5s forwards; }
      #boot-late.now { opacity: 1; animation: none; }
      @keyframes boot-late { to { opacity: 1; } }
    </style>
